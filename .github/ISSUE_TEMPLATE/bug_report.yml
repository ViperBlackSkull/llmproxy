name: Bug Report
description: Report a problem or unexpected behavior
labels: [bug]
assignees: []
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug or unexpected behavior you encountered
      placeholder: Please provide a clear and concise description of what went wrong
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
      description: Describe what you expected to see or happen
      placeholder: Tell us what should have happened
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Detailed steps to reproduce the bug
      placeholder: |
        1. Run `./llmproxy <agent> ...`
        2. Issue the following prompt/command: ...
        3. Observe the following error/behavior: ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste any relevant error messages, logs, or terminal output
      placeholder: |
        Error: ...
        Stack trace: ...
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you running on?
      placeholder: e.g., Ubuntu 22.04, macOS 14.0, Windows 11
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: What version of Go are you using?
      placeholder: e.g., go1.26.0
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Which agent are you using llmproxy with?
      description: Select the AI agent you are proxying
      options:
        - Claude Code
        - OpenAI Codex
        - Aider
        - OpenCode
        - Gemini CLI
        - Pi
        - Generic/Other
      multiple: false
    validations:
      required: false

  - type: textarea
    id: command
    attributes:
      label: Exact command you ran
      description: The exact llmproxy command that caused the issue
      placeholder: ./llmproxy claude -p "hello world"
      render: shell
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Any other relevant information, screenshots, or configuration details
      placeholder: |
        - MITM mode enabled?
        - Custom config settings?
        - Network environment?
    validations:
      required: false
