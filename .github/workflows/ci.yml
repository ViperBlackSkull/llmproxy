name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build project
        # Build to /dev/null: the repo dir is named `llmproxy`, so a bare
        # `go build ./...` would collide with the tracked `llmproxy` launcher.
        run: go build -o /dev/null .

      - name: Run make build
        run: make build
